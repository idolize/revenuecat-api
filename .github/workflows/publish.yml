# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read current and previous versions
        id: versions
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW=$(node -p "require('./package.json').version")
          OLD=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        if: steps.versions.outputs.skip != 'true'
        id: semver
        uses: mage-os/github-actions/semver-compare@v1.7.3
        with:
          version: ${{ steps.versions.outputs.new }}
          compare_against: ${{ steps.versions.outputs.old }}

      - name: Check for version bump
        id: check
        run: |
          if [ "${{ steps.versions.outputs.skip }}" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous version: ${{ steps.versions.outputs.old }}"
          echo "Current version: ${{ steps.versions.outputs.new }}"

          if [ "${{ steps.semver.outputs.result }}" = "1" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.versions.outputs.new }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Publish to npm
        # pnpm publish does not support OIDC trusted publishing (pnpm v11+); npm CLI does.
        run: npm publish --access public
